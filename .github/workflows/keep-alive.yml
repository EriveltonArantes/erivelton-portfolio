name: Keep-alive da sorveteria (cliente em apresentação)

# Render free = 750 horas/mês para a CONTA inteira. Manter vários serviços acordados 24h esgota isso
# em poucos dias e o Render suspende TODOS os serviços free até o mês virar. Por isso: só a sorveteria,
# só no horário comercial (07h–20h de Brasília = 10h–23h UTC) ≈ 390 h/mês.
on:
  schedule:
    - cron: "*/10 10-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping da API da sorveteria
        run: |
          curl -s -o /dev/null -m 120 -w "sorveteria-api -> HTTP %{http_code} em %{time_total}s\n" \
            "https://sorveteria-api-n4vx.onrender.com/actuator/health" || echo "falhou"
